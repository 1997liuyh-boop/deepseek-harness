# 桌面控制源码补丁，通过 CLI 的 tsx 加载器加载预设中的 TypeScript 工具。

- insert:
    - id: preset-computer-use
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: computer-use
        order: 20
        plugins:
          - id: tool-computer-use
            name: './src/index.ts'
            config:
              postActionWaitMs: 600
          - id: tool-code-agent
            name: './src/code-agent.ts'
