- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand: [bash, -c, 'while [ "$1" != "--" ]; do shift; done; shift; exec "$@"', passthrough-runner]
    runnerFailureSignatures: ['passthrough-runner: profile rejected']

- insert:
    - id: llm-replay
      name: "@deepseek-ai/dsh-llm-replay"
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-pro
